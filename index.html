<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Will You Be My Moon? 🌙</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Georgia,"Trebuchet MS",sans-serif;
  background:linear-gradient(145deg,#172b4b,#405579 45%,#17243e);
  color:#fff;
}
#stars{position:fixed;inset:0;overflow:hidden}
.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.65;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.15;transform:scale(.5)}}

.wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:18px}
.card{
  width:min(430px,94vw); min-height:650px; max-height:94vh;
  padding:28px 22px 25px; text-align:center; position:relative;
  border-radius:34px;
  background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 25px 80px rgba(0,0,0,.35);
  backdrop-filter:blur(7px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.moon{
  width:245px;height:245px;border-radius:50%;position:relative;
  margin-bottom:22px;
  background:radial-gradient(circle at 34% 28%,#fffce5 0,#f4e9bd 45%,#c5b98e 100%);
  box-shadow:inset -18px -15px 28px rgba(115,105,80,.18),0 0 45px rgba(255,240,170,.35);
  transition:.55s cubic-bezier(.2,.8,.2,1);
}
.crater{position:absolute;border-radius:50%;background:rgba(117,105,78,.15);box-shadow:inset 3px 3px 5px rgba(100,90,65,.08)}
.c1{width:44px;height:44px;left:42px;top:50px}.c2{width:27px;height:27px;right:48px;top:62px}
.c3{width:53px;height:53px;left:103px;bottom:42px}.c4{width:22px;height:22px;left:53px;bottom:52px}
.eye{position:absolute;width:17px;height:23px;border-radius:50%;background:#20243a;top:91px;transition:.35s}
.eye.left{left:82px}.eye.right{right:82px}
.mouth{position:absolute;width:55px;height:27px;border-bottom:5px solid #6f5360;border-radius:0 0 50% 50%;left:95px;top:125px;transition:.35s}
.blush{position:absolute;width:35px;height:18px;border-radius:50%;background:#ef9fa9;opacity:.35;top:120px;transition:.35s}
.blush.left{left:45px}.blush.right{right:45px}

.moon.happy{transform:scale(1.04);box-shadow:inset -18px -15px 28px rgba(115,105,80,.14),0 0 75px rgba(255,239,165,.65)}
.moon.happy .eye{height:10px;top:99px;border-radius:50% 50% 0 0;background:transparent;border-top:5px solid #20243a}
.moon.happy .mouth{height:42px;top:112px;border-bottom:0;border-top:0;background:#6f5360;border-radius:0 0 50px 50px}
.moon.joy{animation:joy 1.1s ease-in-out infinite alternate}
@keyframes joy{to{transform:scale(1.1) rotate(2deg);filter:brightness(1.08)}}
.moon.joy .mouth{width:72px;height:50px;left:87px;background:#7d5160}
.moon.joy:after{content:"✨";position:absolute;font-size:40px;right:-28px;top:5px;animation:spin 1.3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

h1{font-size:clamp(36px,10vw,55px);line-height:.95;margin:0 0 12px;font-style:italic;font-weight:700;text-shadow:0 3px 8px rgba(0,0,0,.25)}
.pink{color:#ffb2c1}
.sub{font-size:19px;color:#f2dce2;margin:0 0 26px;line-height:1.35;font-style:italic}
.buttons{display:flex;gap:18px;justify-content:center}
button{
  min-width:120px;padding:14px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
  font-size:18px;font-weight:bold;cursor:pointer;transition:.25s;
  box-shadow:0 8px 20px rgba(0,0,0,.18)
}
.yes{background:#fff1b7;color:#39405a}
.maybe{background:#c6b8dc;color:#403650}
button:hover{transform:translateY(-5px) scale(1.04)}
.yes:hover{box-shadow:0 0 30px rgba(255,232,144,.7)}
.hint{font-size:12px;color:#c8cde0;margin-top:18px;opacity:.8}
#final{display:none}
.final-text{font-size:22px;line-height:1.5;color:#ffe7ec}
#confetti{position:fixed;inset:0;pointer-events:none}
.conf{position:absolute;font-size:25px;animation:fall 2.2s linear forwards}
@keyframes fall{from{transform:translateY(-50px) rotate(0);opacity:1}to{transform:translateY(105vh) rotate(500deg);opacity:0}}
@media(max-height:720px){.card{min-height:0;padding:18px}.moon{width:190px;height:190px}.eye{top:70px}.eye.left{left:63px}.eye.right{right:63px}.mouth{left:67px;top:97px}.blush{top:94px}.blush.left{left:35px}.blush.right{right:35px}}
</style>
</head>
<body>
<div id="stars"></div><div id="confetti"></div>

<div class="wrap">
 <main class="card" id="main">
  <div class="moon" id="moon">
   <i class="crater c1"></i><i class="crater c2"></i><i class="crater c3"></i><i class="crater c4"></i>
   <i class="eye left"></i><i class="eye right"></i>
   <i class="blush left"></i><i class="blush right"></i><i class="mouth"></i>
  </div>

  <section id="question">
   <h1>Will you be<br><span class="pink">my moon?</span></h1>
   <p class="sub">I'll be your night forever! 🌙</p>
   <div class="buttons">
    <button class="yes" id="yes">Yes</button>
    <button class="maybe" id="maybe">Maybe</button>
   </div>
   <div class="hint">A little question from someone who likes you ✨</div>
  </section>

  <section id="final">
   <h1>YAY! 🌙</h1>
   <p class="final-text">Then I guess every night just became a little brighter. ✨<br><br>Thank you for being my moon. ❤️</p>
  </section>
 </main>
</div>

<script>
// OPTIONAL: paste your Google Apps Script web-app URL here.
// Example: const TRACKING_URL = "https://script.google.com/macros/s/XXXXXXXX/exec";
const TRACKING_URL = "";

function sendChoice(choice){
  if(!TRACKING_URL) return;
  const data = new URLSearchParams();
  data.append("choice",choice);
  data.append("time",new Date().toISOString());
  // no personal information is sent
  fetch(TRACKING_URL,{method:"POST",mode:"no-cors",body:data}).catch(()=>{});
}

const stars=document.getElementById("stars");
for(let i=0;i<90;i++){
 const s=document.createElement("span"); s.className="star";
 s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
 s.style.animationDelay=Math.random()*3+"s"; stars.appendChild(s);
}
const moon=document.getElementById("moon");
const yes=document.getElementById("yes");
const maybe=document.getElementById("maybe");

yes.addEventListener("mouseenter",()=>moon.classList.add("happy"));
yes.addEventListener("mouseleave",()=>moon.classList.remove("happy"));

yes.addEventListener("click",()=>{
 sendChoice("YES");
 moon.classList.remove("happy"); moon.classList.add("joy");
 document.getElementById("question").style.display="none";
 document.getElementById("final").style.display="block";
 for(let i=0;i<45;i++){
   const c=document.createElement("span"); c.className="conf";
   c.textContent=["✨","🌙","❤️","⭐","💫"][Math.floor(Math.random()*5)];
   c.style.left=Math.random()*100+"%"; c.style.top="-30px";
   c.style.animationDelay=Math.random()*.8+"s"; document.getElementById("confetti").appendChild(c);
 }
});

maybe.addEventListener("click",()=>{
 sendChoice("MAYBE");
 moon.classList.add("happy");
 maybe.textContent="Think about it 👀";
 setTimeout(()=>maybe.textContent="Maybe",1400);
});
</script>
</body>
</html>
